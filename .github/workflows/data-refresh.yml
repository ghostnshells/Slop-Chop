name: data-refresh

# Validates repo data only. Does not call X, does not read API keys, and does
# not push. Nightly numbers land through a reviewed pull request.
# Runs on the default branch after merge. Until repository variable
# DATA_REFRESH_SOURCE is exactly "inbox", that step exits successfully and does
# nothing. CLANKWALL_REFRESH=public compares the committed snapshot with
# https://clankwall.vogel.dev and does not write or push.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate inbox only when a source is configured
        env:
          DATA_REFRESH_SOURCE: ${{ vars.DATA_REFRESH_SOURCE }}
        run: npm run data:refresh
      - name: Compare Clankwall only when the public feed is authorized
        env:
          CLANKWALL_REFRESH: ${{ vars.CLANKWALL_REFRESH }}
        run: npm run clankwall:refresh
